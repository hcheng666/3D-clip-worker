name: ${COMPOSE_PROJECT_NAME:-three-d-tiles-clip-worker}

services:
  clip-worker:
    image: ${CLIP_WORKER_IMAGE:-3d-tiles-clip-worker:0.1.7}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: ${CLIP_WORKER_BASE_IMAGE:-ubuntu:24.04}
        VCPKG_REF: ${CLIP_WORKER_VCPKG_REF:-2025.07.25}
        VCPKG_REPOSITORY: ${CLIP_WORKER_VCPKG_REPOSITORY:-https://github.com/microsoft/vcpkg.git}
        VCPKG_ASSET_PREFIX: ${CLIP_WORKER_VCPKG_ASSET_PREFIX:-https://github.com}
        VCPKG_GITHUB_ASSET_PREFIX: ${CLIP_WORKER_VCPKG_GITHUB_ASSET_PREFIX:-}
        VCPKG_SQLITE_MIRROR_PREFIX: ${CLIP_WORKER_VCPKG_SQLITE_MIRROR_PREFIX:-}
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: ${CLIP_WORKER_STOP_GRACE_PERIOD:-10m}
    environment:
      CLIP_WORKER_CONTROL_PLANE_URL: ${CLIP_WORKER_CONTROL_PLANE_URL:?CLIP_WORKER_CONTROL_PLANE_URL is required}
      CLIP_WORKER_ID: ${CLIP_WORKER_ID:-}
      CLIP_WORKER_AUTHORIZATION_HEADER: ${CLIP_WORKER_AUTHORIZATION_HEADER:-}
      CLIP_WORKER_ALGORITHM_VERSION: ${CLIP_WORKER_ALGORITHM_VERSION:-v8}
      CLIP_WORKER_MAX_INPUT_BYTES: ${CLIP_WORKER_MAX_INPUT_BYTES:-67108864}
      CLIP_WORKER_MAX_OUTPUT_BYTES: ${CLIP_WORKER_MAX_OUTPUT_BYTES:-67108864}
      CLIP_WORKER_POLL_INTERVAL_SECONDS: ${CLIP_WORKER_POLL_INTERVAL_SECONDS:-5}
      CLIP_WORKER_HEARTBEAT_INTERVAL_SECONDS: ${CLIP_WORKER_HEARTBEAT_INTERVAL_SECONDS:-30}
      CLIP_WORKER_API_CONNECT_TIMEOUT_SECONDS: ${CLIP_WORKER_API_CONNECT_TIMEOUT_SECONDS:-10}
      CLIP_WORKER_API_REQUEST_TIMEOUT_SECONDS: ${CLIP_WORKER_API_REQUEST_TIMEOUT_SECONDS:-30}
      CLIP_WORKER_TRANSFER_CONNECT_TIMEOUT_SECONDS: ${CLIP_WORKER_TRANSFER_CONNECT_TIMEOUT_SECONDS:-10}
      CLIP_WORKER_TRANSFER_REQUEST_TIMEOUT_SECONDS: ${CLIP_WORKER_TRANSFER_REQUEST_TIMEOUT_SECONDS:-300}
      CLIP_WORKER_LOG_LEVEL: ${CLIP_WORKER_LOG_LEVEL:-INFO}
    logging:
      driver: json-file
      options:
        max-size: ${CLIP_WORKER_LOG_MAX_SIZE:-10m}
        max-file: ${CLIP_WORKER_LOG_MAX_FILES:-5}
